# ============================================================
# MiniSearchRec - Hint 相关搜索（点后推）配置
# ============================================================

recall_stages:
  - name: "HintTagRecall"
    enable: true
    depends_on: []
  - name: "HintCategoryRecall"
    enable: true
    depends_on: []
  - name: "HintCooccurRecall"
    enable: true
    depends_on: []
  - name: "HintQueryExpandRecall"
    enable: true
    depends_on: []

rank_config:
  rank:
    top_k: 8
    processors:
      - name: "WeightedSumScorer"
        weight: 1.0
        params:
          features:
            - {name: "tag_relevance", weight: 0.4}
            - {name: "category_relevance", weight: 0.3}
            - {name: "cooccur_score", weight: 0.2}
            - {name: "query_relevance", weight: 0.1}
