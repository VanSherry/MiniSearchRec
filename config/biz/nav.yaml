# ============================================================
# MiniSearchRec - Nav 教育页（搜前引导）配置
# ============================================================

recall_stages:
  - name: "NavGlobalHotRecall"
    enable: true
    depends_on: []
  - name: "NavDocTitleRecall"
    enable: true
    depends_on: []
  - name: "NavPresetRecall"
    enable: true
    depends_on: []

rank_config:
  factory: "NavFactory"
  coarse_processors:
    - name: "WeightedSumScorer"
      weight: 1.0
      params:
        features:
          - {name: "heat", weight: 1.0}

nav:
  max_results: 6
