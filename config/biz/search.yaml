# ============================================================
# MiniSearchRec - Search 垂搜业务配置
# ============================================================

recall_stages:
  - name: "InvertedRecallProcessor"
    enable: true
    depends_on: []
    max_recall: 1000
  - name: "UserHistoryRecallProcessor"
    enable: true
    depends_on: []
    max_recall: 200
  - name: "HotContentRecallProcessor"
    enable: true
    depends_on: []
    max_recall: 100
  - name: "VectorRecallProcessor"
    enable: true
    depends_on: []
    max_recall: 200

rank_config:
  rank:
    top_k: 500
    processors:
      - name: "BM25RankProcessor"
        weight: 0.6
      - name: "QualityRankProcessor"
        weight: 0.2
      - name: "FreshnessRankProcessor"
        weight: 0.2
  rerank:
    top_k: 100
    processors:
      - name: "LGBMRankProcessor"
        weight: 0.8

filter_stages:
  - name: "DedupFilterProcessor"
    params: { similarity_threshold: 0.95 }
  - name: "QualityFilterProcessor"
    params: { min_quality_score: 0.0, min_click_count: 0, min_content_length: 0 }
  - name: "SpamFilterProcessor"
    params: { spam_threshold: 0.99 }
  - name: "BlacklistFilterProcessor"
    params: { blacklist_file: "" }

postprocess_stages:
  - name: "MMRRerankProcessor"
    params: { lambda: 0.7, top_k: 20 }
