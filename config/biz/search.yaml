# ============================================================
# MiniSearchRec - Search 垂搜业务配置
# 一个业务一个文件，包含该业务 Pipeline 的全部 Processor 配置
# ============================================================

# ── 召回阶段（DAG 并行，depends_on 声明依赖）──
recall_stages:
  - name: "InvertedRecallProcessor"
    enable: true
    depends_on: []           # 无依赖，立即并行启动
    max_recall: 1000
    params:
      min_term_freq: 1

  - name: "UserHistoryRecallProcessor"
    enable: true
    depends_on: []           # 无依赖，立即并行启动
    max_recall: 200
    params:
      history_window_days: 30

  - name: "HotContentRecallProcessor"
    enable: true
    depends_on: []           # 无依赖，立即并行启动
    max_recall: 100
    params:
      time_window_hours: 24
      refresh_interval_sec: 300

  - name: "VectorRecallProcessor"
    enable: true
    depends_on: []           # 无依赖，立即并行启动
    max_recall: 200
    params:
      top_k: 200
      similarity_threshold: 0.3
      embedding_dim: 768

# ── 粗排/精排配置（由 RankManager 加载，配置驱动）──
rank_config:
  factory: "SearchFactory"
  coarse_processors:
    - name: "BM25RankProcessor"
      weight: 0.6
    - name: "QualityRankProcessor"
      weight: 0.2
    - name: "FreshnessRankProcessor"
      weight: 0.2
  fine_processors:
    - name: "LGBMRankProcessor"
      weight: 0.8

# ── 过滤阶段 ──
filter_stages:
  - name: "DedupFilterProcessor"
    params:
      similarity_threshold: 0.9

  - name: "QualityFilterProcessor"
    params:
      min_quality_score: 0.0
      min_click_count: 0
      min_content_length: 10

  - name: "SpamFilterProcessor"
    params:
      spam_threshold: 0.8

  - name: "BlacklistFilterProcessor"
    params:
      blacklist_file: "./config/blacklist.txt"

# ── 后处理阶段 ──
postprocess_stages:
  - name: "MMRRerankProcessor"
    params:
      lambda: 0.7
      top_k: 20
