# ============================================================
# MiniSearchRec - Sug 搜索建议配置
# ============================================================

recall_stages:
  - name: "SugTrieRecallProcessor"
    enable: true
    depends_on: []

rank_config:
  rank:
    top_k: 8
    processors:
      - name: "WeightedSumScorer"
        weight: 1.0
        params:
          features:
            - {name: "prefix_match", weight: 0.4}
            - {name: "freq_norm", weight: 0.3}
            - {name: "freshness", weight: 0.3}
